[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unified-backtesting-engine"
version = "0.1.0"
description = "A unified interface and output across backtesting engines (vectorbt, backtrader, NautilusTrader)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["backtesting", "quant", "trading", "vectorbt", "backtrader", "nautilus"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pandas-market-calendars>=4.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
vectorbt = ["vectorbt"]
backtrader = ["backtrader"]
nautilus = ["nautilus-trader"]
all = ["vectorbt", "backtrader", "nautilus-trader"]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "hypothesis",
    "pandas-stubs",
    "nautilus-trader",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ube"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
# Target 3.12 rather than the 3.11 minimum: numpy>=2.1's stubs use PEP 695
# `type` statements, which need 3.12 grammar to parse. The 3.11 CI job still
# enforces runtime compatibility, so this is type-check-only and harmless.
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["ube.core", "ube.core.*"]
strict = true

# The vectorbt/backtrader adapters are bare stubs (their own Phase-2 work is deferred);
# they intentionally do not yet implement the typed `run` override.
[[tool.mypy.overrides]]
module = [
    "ube.adapters.vectorbt_adapter",
    "ube.adapters.vectorbt_adapter.*",
    "ube.adapters.backtrader_adapter",
    "ube.adapters.backtrader_adapter.*",
]
disable_error_code = ["override"]

# nautilus_trader ships compiled Cython (.pyd) modules without stubs. Treat the
# package as dynamically-typed rather than requiring stubs it does not ship.
[[tool.mypy.overrides]]
module = ["nautilus_trader.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
